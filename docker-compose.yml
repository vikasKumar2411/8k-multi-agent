services:
  postgres:
    image: postgres:16
    container_name: sec-copilot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: sec_copilot
      POSTGRES_PASSWORD: sec_copilot
      POSTGRES_DB: sec_copilot

    ports:
      - "5432:5432"

    volumes:
      - sec_copilot_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U sec_copilot -d sec_copilot",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sec_copilot_postgres_data: